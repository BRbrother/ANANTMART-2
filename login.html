<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ANANTMART</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Gram Mart Favicon -->
<link rel="icon" type="image/png" href="images/gram-mart-icon.png">
<link rel="apple-touch-icon" href="images/gram-mart-icon.png">
</head>
<body>

  <div class="auth-container">
    <div class="auth-brand">
    <a href="index.html" aria-label="Gram Mart Home">
        <img
            src="images/gram-mart-logo.png"
            alt="Gram Mart"
            class="auth-wordmark"
        >
    </a>
    <p>Everyday Groceries, Made Easy</p>
</div>
    <h1>Login</h1>

    <form id="loginForm">
      <input
        type="email"
        id="loginEmail"
        placeholder="Email"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>

    <p>
      New User?
      <a href="register.html">Create Account</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      loginUser();
    });
  </script>

</body>
</html>
