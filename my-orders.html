<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Gram Mart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #0B3091;
      --orange: #FF6A00;
      --light: #F5F7FB;
      --text: #202633;
      --muted: #6B7280;
      --border: #E5E7EB;
      --green: #15803D;
      --red: #DC2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--light);
      color: var(--text);
    }

    [hidden] { display: none !important; }

    header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 13px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--blue);
      font-weight: 800;
      font-size: 22px;
      text-decoration: none;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    nav a {
      text-decoration: none;
      color: var(--blue);
      font-size: 14px;
      font-weight: 600;
    }

    .container {
      width: min(100% - 30px, 950px);
      margin: 30px auto 60px;
    }

    .page-heading {
      margin-bottom: 22px;
    }

    .page-heading h1 {
      color: var(--blue);
      font-size: 27px;
      margin: 0 0 5px;
    }

    .page-heading p {
      color: var(--muted);
      margin: 0;
      font-size: 13px;
    }

    .message {
      padding: 13px 15px;
      border-radius: 9px;
      margin: 15px 0;
      font-size: 13px;
      display: none;
    }

    .message.show { display: block; }
    .message.error { background: #FEE2E2; color: #991B1B; }
    .message.success { background: #DCFCE7; color: #166534; }
    .message.info { background: #DBEAFE; color: #1E40AF; }

    .order-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.035);
    }

    .order-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .order-id {
      font-weight: 700;
      color: var(--blue);
      font-size: 14px;
      word-break: break-all;
    }

    .order-date {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .status {
      display: inline-block;
      border-radius: 30px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      background: #DBEAFE;
      color: #1E40AF;
      text-transform: capitalize;
    }

    .status.delivered,
    .status.refunded { background: #DCFCE7; color: #166534; }

    .status.cancelled { background: #FEE2E2; color: #991B1B; }

    .status.out_for_delivery { background: #FEF3C7; color: #92400E; }

    .items {
      padding: 13px 0;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      font-size: 13px;
    }

    .item-name { font-weight: 500; }
    .item-price { white-space: nowrap; color: var(--muted); }

    .order-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .total {
      font-size: 18px;
      font-weight: 800;
      color: var(--blue);
    }

    .actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      font-weight: 600;
      font-size: 12px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .cancel-btn {
      background: #FEE2E2;
      color: #B91C1C;
    }

    .primary-btn {
      background: var(--orange);
      color: white;
    }

    .secondary-btn {
      background: #E5E7EB;
      color: #374151;
    }

    .refund-box {
      background: #FFF7ED;
      border: 1px solid #FED7AA;
      border-radius: 11px;
      padding: 16px;
      margin-top: 16px;
    }

    .refund-box h3 {
      margin: 0 0 6px;
      color: #9A3412;
      font-size: 15px;
    }

    .refund-box p {
      font-size: 12px;
      color: #7C2D12;
      margin: 4px 0 12px;
    }

    .refund-form {
      display: grid;
      gap: 11px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 11px;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      background: white;
    }

    .refund-status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #F3F4F6;
      font-size: 12px;
      line-height: 1.7;
    }

    .empty {
      background: white;
      border-radius: 14px;
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty h2 {
      color: var(--blue);
      margin-top: 0;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: var(--muted);
    }

    footer {
      text-align: center;
      padding: 22px;
      background: white;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header { padding: 11px 15px; }
      .brand { font-size: 18px; }
      .brand img { width: 35px; height: 35px; }
      nav { gap: 11px; }
      nav a { font-size: 12px; }
      .page-heading h1 { font-size: 23px; }
      .order-card { padding: 15px; }
      .order-bottom { align-items: flex-start; }
      .actions { width: 100%; }
      .actions button { flex: 1; }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="brand">
    <img src="images/gram-mart-logo.png" alt="Gram Mart">
    <span>Gram Mart</span>
  </a>

  <nav>
    <a href="index.html">Shop</a>
    <a href="cart.html">My Cart</a>
  </nav>
</header>

<main class="container">
  <div class="page-heading">
    <h1>My Orders</h1>
    <p>Track your orders and manage cancellations or refunds.</p>
  </div>

  <div id="message" class="message"></div>
  <div id="ordersList">
    <div class="loading">Loading your orders...</div>
  </div>
</main>

<footer>
  © <span id="year"></span> Gram Mart. Har Zarurat Ek Jagah.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
  const client = window.supabaseClient;

  const ordersList = document.getElementById("ordersList");
  const messageBox = document.getElementById("message");

  let currentUser = null;

  document.getElementById("year").textContent = new Date().getFullYear();

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char];
    });
  }

  function money(value) {
    return "₹" + Number(value || 0).toFixed(2);
  }

  function showMessage(text, type = "info") {
    messageBox.textContent = text;
    messageBox.className = "message show " + type;
    messageBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function hideMessage() {
    messageBox.className = "message";
    messageBox.textContent = "";
  }

  function readableStatus(status) {
    return String(status || "pending")
      .replaceAll("_", " ")
      .replace(/\b\w/g, letter => letter.toUpperCase());
  }

  function canCancel(status) {
    return !["out_for_delivery", "delivered", "cancelled"]
      .includes(String(status || "").toLowerCase());
  }

  function refundStatusLabel(status) {
    const labels = {
      refund_pending: "Refund Pending",
      refund_processing: "Refund Processing",
      refunded: "Refund Completed"
    };

    return labels[status] || readableStatus(status);
  }

  async function loadOrders() {
    hideMessage();
    ordersList.innerHTML = '<div class="loading">Loading your orders...</div>';

    if (!client) {
      ordersList.innerHTML = '<div class="empty">Supabase connection not found. Please check js/supabase.js.</div>';
      return;
    }

    const { data: authData, error: authError } = await client.auth.getUser();

    if (authError || !authData?.user) {
      ordersList.innerHTML = `
        <div class="empty">
          <h2>Please Login</h2>
          <p>Login to your Gram Mart account to see your orders.</p>
          <button class="primary-btn" onclick="location.href='login.html'">Login Now</button>
        </div>`;
      return;
    }

    currentUser = authData.user;

    const { data: orders, error: ordersError } = await client
      .from("orders")
      .select("id,user_id,total_amount,status,created_at,payment_status")
      .eq("user_id", currentUser.id)
      .order("created_at", { ascending: false });

    if (ordersError) {
      console.error(ordersError);
      ordersList.innerHTML = '<div class="empty">Unable to load orders. Please refresh the page.</div>';
      return;
    }

    if (!orders || orders.length === 0) {
      ordersList.innerHTML = `
        <div class="empty">
          <h2>No Orders Yet</h2>
          <p>You haven't placed any orders yet.</p>
          <button class="primary-btn" onclick="location.href='index.html'">Start Shopping</button>
        </div>`;
      return;
    }

    const orderIds = orders.map(order => order.id);

    const { data: allItems, error: itemsError } = await client
      .from("order_items")
      .select("order_id,product_name,unit_price,quantity")
      .in("order_id", orderIds);

    if (itemsError) {
      console.error(itemsError);
      ordersList.innerHTML = '<div class="empty">Unable to load order items. Please refresh.</div>';
      return;
    }

    const { data: refunds, error: refundsError } = await client.rpc(
      "customer_get_my_gram_mart_refunds"
    );

    if (refundsError) {
      console.error("Refund fetch error:", refundsError);
    }

    const itemsByOrder = {};
    (allItems || []).forEach(item => {
      if (!itemsByOrder[item.order_id]) itemsByOrder[item.order_id] = [];
      itemsByOrder[item.order_id].push(item);
    });

    const refundsByOrder = {};
    (refunds || []).forEach(refund => {
      refundsByOrder[refund.order_id] = refund;
    });

    ordersList.innerHTML = orders.map(order => {
      const items = itemsByOrder[order.id] || [];
      const refund = refundsByOrder[order.id];
      const status = String(order.status || "pending").toLowerCase();

      const itemHTML = items.map(item => `
        <div class="item-row">
          <span class="item-name">
            ${escapeHTML(item.product_name)}
            × ${Number(item.quantity || 0)}
          </span>
          <span class="item-price">
            ${money(Number(item.unit_price || 0) * Number(item.quantity || 0))}
          </span>
        </div>
      `).join("");

      let refundHTML = "";

      if (refund) {
        if (
          refund.refund_status === "refund_pending" &&
          !refund.details_submitted
        ) {
          refundHTML = `
            <div class="refund-box">
              <h3>Refund Details Required</h3>
              <p>Your order was cancelled. Submit your UPI ID or bank details so the refund can be processed.</p>

              <form class="refund-form" onsubmit="submitRefund(event, '${order.id}')">

                <div class="form-group">
                  <label>Refund Method</label>
                  <select name="refund_method" required
                    onchange="toggleRefundMethod(this, '${order.id}')">
                    <option value="upi">UPI</option>
                    <option value="bank">Bank Transfer</option>
                  </select>
                </div>

                <div class="form-group" id="upi-${order.id}">
                  <label>UPI ID</label>
                  <input type="text" name="refund_upi_id"
                    placeholder="example@upi">
                </div>

                <div id="bank-${order.id}" hidden>
                  <div class="form-group">
                    <label>Account Holder Name</label>
                    <input type="text" name="account_holder"
                      placeholder="Name as per bank account">
                  </div>

                  <div class="form-group">
                    <label>Account Number</label>
                    <input type="text" name="account_number"
                      inputmode="numeric" placeholder="Bank account number">
                  </div>

                  <div class="form-group">
                    <label>IFSC Code</label>
                    <input type="text" name="ifsc_code"
                      placeholder="e.g. SBIN0001234">
                  </div>
                </div>

                <button type="submit" class="primary-btn">
                  Submit Refund Details
                </button>
              </form>
            </div>
          `;
        } else {
          refundHTML = `
            <div class="refund-status">
              <strong>Refund:</strong>
              ${escapeHTML(refundStatusLabel(refund.refund_status))}
              <br>
              <strong>Refund Amount:</strong>
              ${money(refund.refund_amount)}
              ${
                refund.refund_utr
                  ? `<br><strong>Refund UTR:</strong> ${escapeHTML(refund.refund_utr)}`
                  : ""
              }
              ${
                refund.admin_note
                  ? `<br><strong>Note:</strong> ${escapeHTML(refund.admin_note)}`
                  : ""
              }
            </div>
          `;
        }
      }

      return `
        <section class="order-card">
          <div class="order-top">
            <div>
              <div class="order-id">Order #${escapeHTML(order.id)}</div>
              <div class="order-date">
                ${new Date(order.created_at).toLocaleString("en-IN")}
              </div>
            </div>
            <span class="status ${escapeHTML(status)}">
              ${escapeHTML(readableStatus(status))}
            </span>
          </div>

          <div class="items">
            ${itemHTML || '<p>No item details found.</p>'}
          </div>

          <div class="order-bottom">
            <div>
              <div style="font-size:11px;color:#6B7280;">Order Total</div>
              <div class="total">${money(order.total_amount)}</div>
            </div>

            <div class="actions">
              ${
                canCancel(status)
                  ? `<button class="cancel-btn"
                      onclick="cancelOrder('${order.id}', this)">
                      Cancel Order
                    </button>`
                  : ""
              }
            </div>
          </div>

          ${refundHTML}
        </section>
      `;
    }).join("");
  }

  async function cancelOrder(orderId, button) {
    const confirmed = confirm(
      "Are you sure you want to cancel this order?"
    );

    if (!confirmed) return;

    button.disabled = true;
    button.textContent = "Cancelling...";

    const { data, error } = await client.rpc(
      "customer_cancel_gram_mart_order",
      { p_order_id: orderId }
    );

    if (error) {
      console.error(error);
      showMessage(error.message || "Unable to cancel this order.", "error");
      button.disabled = false;
      button.textContent = "Cancel Order";
      return;
    }

    showMessage(
      data?.message || "Order cancellation request completed.",
      "success"
    );

    await loadOrders();
  }

  function toggleRefundMethod(select, orderId) {
    const method = select.value;
    const upiWrap = document.getElementById("upi-" + orderId);
    const bankWrap = document.getElementById("bank-" + orderId);

    const upiInput = upiWrap.querySelector("input");
    const bankInputs = bankWrap.querySelectorAll("input");

    if (method === "upi") {
      upiWrap.hidden = false;
      bankWrap.hidden = true;

      upiInput.required = true;
      bankInputs.forEach(input => input.required = false);
    } else {
      upiWrap.hidden = true;
      bankWrap.hidden = false;

      upiInput.required = false;
      bankInputs.forEach(input => input.required = true);
    }
  }

  async function submitRefund(event, orderId) {
    event.preventDefault();

    const form = event.target;
    const button = form.querySelector('button[type="submit"]');
    const formData = new FormData(form);

    const method = formData.get("refund_method");

    const payload = {
      p_order_id: orderId,
      p_refund_method: method,
      p_refund_upi_id: method === "upi"
        ? String(formData.get("refund_upi_id") || "").trim()
        : null,
      p_account_holder: method === "bank"
        ? String(formData.get("account_holder") || "").trim()
        : null,
      p_account_number: method === "bank"
        ? String(formData.get("account_number") || "").trim()
        : null,
      p_ifsc_code: method === "bank"
        ? String(formData.get("ifsc_code") || "").trim().toUpperCase()
        : null
    };

    if (method === "upi" && !payload.p_refund_upi_id) {
      showMessage("Please enter your UPI ID.", "error");
      return;
    }

    if (method === "bank" && (
      !payload.p_account_holder ||
      !payload.p_account_number ||
      !payload.p_ifsc_code
    )) {
      showMessage("Please complete all bank details.", "error");
      return;
    }

    const confirmed = confirm(
      "Please confirm that these refund details are correct."
    );

    if (!confirmed) return;

    button.disabled = true;
    button.textContent = "Submitting...";

    const { data, error } = await client.rpc(
      "customer_submit_gram_mart_refund_details",
      payload
    );

    if (error) {
      console.error(error);
      showMessage(error.message || "Unable to submit refund details.", "error");
      button.disabled = false;
      button.textContent = "Submit Refund Details";
      return;
    }

    showMessage(
      data?.message || "Refund details submitted successfully.",
      "success"
    );

    await loadOrders();
  }

  loadOrders();
</script>

</body>
</html>
