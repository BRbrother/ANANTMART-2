<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Gram Mart</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/gram-mart-icon.png">
    <link rel="apple-touch-icon" href="images/gram-mart-icon.png">

    <style>
        .auth-container {
            max-width: 420px;
            margin: 40px auto;
            padding: 28px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 22px rgba(0,0,0,.08);
        }

        .auth-container h1 {
            text-align: center;
            color: #FF6A00;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 24px;
        }

        .auth-container input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .auth-container button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #FF6A00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-container button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #registerMessage {
            margin-top: 14px;
            text-align: center;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .auth-container a {
            color: #0B3091;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-brand">
            <a href="index.html" aria-label="Gram Mart Home">
                <img
                    src="images/gram-mart-logo.png"
                    alt="Gram Mart"
                    class="auth-wordmark"
                >
            </a>
            <p>Everyday Groceries, Made Easy</p>
        </div>

        <h1>Create Account</h1>
        <p class="auth-subtitle">Join Gram Mart today</p>

        <form id="registerForm">
            <input
                type="text"
                id="name"
                placeholder="Full Name"
                autocomplete="name"
                maxlength="100"
                required
            >

            <input
                type="tel"
                id="mobile"
                placeholder="10-digit Mobile Number"
                autocomplete="tel"
                inputmode="numeric"
                pattern="[6-9][0-9]{9}"
                maxlength="10"
                title="Enter a valid 10-digit Indian mobile number"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                autocomplete="email"
                maxlength="254"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Create Password (minimum 8 characters)"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit" id="registerButton">
                Create Account
            </button>
        </form>

        <p id="registerMessage" role="status" aria-live="polite"></p>

        <p style="text-align:center; margin-top:20px;">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>
        (() => {
            const form = document.getElementById("registerForm");
            const button = document.getElementById("registerButton");
            const message = document.getElementById("registerMessage");

            function showMessage(text, isError = false) {
                message.textContent = text;
                message.style.color = isError ? "#c62828" : "#16803c";
            }

            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                const name = document.getElementById("name").value.trim();
                const mobile = document.getElementById("mobile").value.trim();
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;
                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                if (password !== confirmPassword) {
                    showMessage("Passwords do not match.", true);
                    return;
                }

                if (!/^[6-9]\d{9}$/.test(mobile)) {
                    showMessage(
                        "Enter a valid 10-digit Indian mobile number.",
                        true
                    );
                    return;
                }

                const supabase = window.supabaseClient;

                if (!supabase) {
                    showMessage(
                        "Connection error. Please check js/supabase.js.",
                        true
                    );
                    return;
                }

                button.disabled = true;
                showMessage("Creating your account...");

                try {
                    const { data, error } = await supabase.auth.signUp({
                        email,
                        password,
                        options: {
                            data: {
                                full_name: name,
                                phone: mobile
                            }
                        }
                    });

                    if (error) throw error;

                    if (!data.user) {
                        throw new Error(
                            "Account could not be created. Please try again."
                        );
                    }

                    if (!data.session) {
                        showMessage(
                            "Account created, but automatic login is unavailable. " +
                            "Check that email confirmation is OFF in Supabase, " +
                            "then try logging in.",
                            true
                        );
                        return;
                    }

                    showMessage("Account created successfully! Redirecting...");

                    window.location.replace("index.html");

                } catch (error) {
                    console.error("Registration error:", error);

                    let errorMessage =
                        error.message || "Registration failed. Please try again.";

                    if (errorMessage.toLowerCase().includes("already registered")) {
                        errorMessage =
                            "This email is already registered. Please log in.";
                    }

                    showMessage(errorMessage, true);
                } finally {
                    button.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
